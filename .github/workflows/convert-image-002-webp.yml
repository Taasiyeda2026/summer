name: Convert image 002 to WebP

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/convert-image-002-webp.yml"

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Convert image and refresh cache
        run: |
          cwebp -quiet -q 86 -m 6 image/002.png -o image/002.webp
          python - <<'PY'
          from pathlib import Path

          path = Path("sw.js")
          text = path.read_text(encoding="utf-8")
          old = 'const CACHE_NAME = "summer-catalog-v2026-07-26-israa-files-refresh-v420";'
          new = 'const CACHE_NAME = "summer-catalog-v2026-07-27-image-002-refresh-v421";'
          if old not in text:
              raise SystemExit("Expected cache version was not found in sw.js")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit generated WebP and cache refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image/002.webp sw.js
          git commit -m "Convert image 002 to WebP and refresh cache"
          git push
